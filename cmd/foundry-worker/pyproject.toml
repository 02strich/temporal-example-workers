[project]
name = "temporal-foundry-worker"
version = "0.1.0"
description = "A bounded background Temporal worker hosted in Azure Foundry"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-ai-agentserver-core==2.3.0",
    "azure-ai-agentserver-invocations==1.3.0",
    "starlette==1.10.0",
    "temporalio==1.36.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a running Temporal dev server"]
